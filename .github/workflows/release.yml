name: Release zipped package

on:
  push:
    tags:
      - "*.*.*"

jobs:
  zip-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Zip source
        uses: papeloto/action-zip@5f1c4aa587ea41db1110df6a99981dbe19cee310 # v1
        with:
          files: src/
          dest: mod_ttstand.zip
      - name: Create release with zip-file
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: mod_ttstand.zip
      - name: Deploy update server
        uses: kevinpainchaud/simple-ftp-deploy-action@2c6e7dfe809abd4f8f687a78b5d79efaf5c439ad # v1.2.1
        with:
          ftp_host: ${{ secrets.FTP_HOST }}
          ftp_username: ${{ secrets.FTP_USERNAME }}
          ftp_password: ${{ secrets.FTP_PASSWORD }}
          local_source_dir: "update-server"
          dist_target_dir: "www/updates"
          delete: "false"
      - name: Deploy changelog
        uses: kevinpainchaud/simple-ftp-deploy-action@2c6e7dfe809abd4f8f687a78b5d79efaf5c439ad # v1.2.1
        with:
          ftp_host: ${{ secrets.FTP_HOST }}
          ftp_username: ${{ secrets.FTP_USERNAME }}
          ftp_password: ${{ secrets.FTP_PASSWORD }}
          local_source_dir: "changelog-server"
          dist_target_dir: "www/changelogs"
          delete: "false"
